name: customer-language-customer-reported-negation-01
description: Negated/resolved/reported faults must not create a repair ticket; clarify
  if necessary. Fixed CHN-S-000001 warranty ownership is a fake-backend fixture.
backend: fake
actor:
  oa: customer
  role: sales
  language: th
  permissions: customer
steps:
- seed:
    warranties:
    - serial_number: ONLY00001
      product_name: แอร์ทดสอบ
      customer_chann_uid: CHN-S-000001
      warranty_end: '2099-01-01'
- send: ยังไม่เสียครับ แอร์เย็นปกติ
  expect:
    is_not:
    - generic_error
    - permission
    not_contains:
    - T-2026-0001
    - รับแจ้งแล้ว
    - ขอที่อยู่
    max_lines: 15
- send: งานของฉัน
  expect:
    is_not:
    - generic_error
    - permission
    not_contains:
    - T-2026-0001
    max_lines: 15
