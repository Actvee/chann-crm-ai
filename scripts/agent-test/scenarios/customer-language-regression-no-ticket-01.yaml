    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - T-2026-0001
    - ขอที่อยู่
    - รับแจ้งแล้ว
    max_lines: 15
- send: งานของฉัน
  expect:
    is_not:
    - generic_error
    - permission
    not_contains:
    - T-2026-0001
    max_lines: 15
