name: customer-language-regression-no-ticket-01
description: 'Regression no-ticket: assert observable reply and read-back state; offline,
  synthetic fixture.'
backend: fake
actor:
  oa: customer
  role: sales
  language: th
  permissions: customer
steps:
- seed:
    warranties:
    - serial_number: ONLY00001
      product_name: แอร์ทดสอบ
      customer_chann_uid: CHN-S-000001
      warranty_end: '2099-01-01'
- send: ขอทราบค่าล้างแอร์หน่อยค่ะ
