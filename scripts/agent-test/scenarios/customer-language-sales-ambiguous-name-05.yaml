name: customer-language-sales-ambiguous-name-05
description: 'POST-PARSE CONTROL ONLY: given a read/customer intent for ambiguous
  สม, offer both choices. Bare สม parsing remains in model-evaluation corpus; no claim
  that a bare name is a deterministic command.'
backend: any
actor:
  oa: sales
  role: sales
  language: th
  permissions: sales
steps:
- seed:
    customers:
    - first_name: สมชาย
      phone: 0812345678
    - first_name: สมหญิง
      phone: 0898765432
- send:
    message: สม
    ai:
      action: read
      entity: customer
      fields:
        target_name: สม
      missing: []
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains:
    - สมชาย
    - สมหญิง
    actions_include:
    - C-2026-0001
    - C-2026-0002
