name: customer-language-sales-pending-flow-02
description: Explicit stub establishes pending customer creation; protect phone validation,
  cancellation, read interruption or confirm flow switch. Correct continuation intents
  are supplied because slot filling is model-driven; this verifies merge/validation,
  not model parsing.
backend: any
actor:
  oa: sales
  role: sales
  language: th
  permissions: sales
steps:
- seed:
    customers:
    - first_name: สมชาย
      phone: 0812345678
- send:
    message: มีลูกค้าใหม่ชื่อ สมหญิง รักดี แต่ยังไม่รู้เบอร์
    ai:
      action: create
      entity: customer
      fields:
        first_name: สมหญิง
        last_name: รักดี
      missing:
      - phone
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains: เบอร์
- send:
    message: พรุ่งนี้สิบโมง
    ai:
      action: create
      entity: customer
      fields:
        notes: พรุ่งนี้สิบโมง
      missing:
      - phone
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - C-2026-0002
    max_lines: 15
    contains: เบอร์
- send:
    message: 0898765432
    ai:
      action: create
      entity: customer
      fields:
        phone: 0898765432
      missing: []
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains:
    - สมหญิง
    - รักดี
- send: รายชื่อลูกค้า
  expect:
    contains:
    - สมหญิง
    - C-2026-0002
    - 0898765432
    is_not:
    - generic_error
    - permission
