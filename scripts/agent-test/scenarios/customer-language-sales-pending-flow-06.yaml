name: customer-language-sales-pending-flow-06
description: Explicit stub establishes pending customer creation; protect phone validation,
  cancellation, read interruption or confirm flow switch.
backend: any
actor:
  oa: sales
  role: sales
  language: th
  permissions: sales
steps:
- seed:
    customers:
    - first_name: สมชาย
      phone: 0812345678
- send:
    message: มีลูกค้าใหม่ชื่อ สมหญิง รักดี แต่ยังไม่รู้เบอร์
    ai:
      action: create
      entity: customer
      fields:
        first_name: สมหญิง
        last_name: รักดี
      missing:
      - phone
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains: เบอร์
- send: สร้างดีลให้ สมชาย
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - D-2026-0001
    max_lines: 15
    regex: ยกเลิก.*สร้างดีล|สร้างดีล.*แทน|เปลี่ยน
