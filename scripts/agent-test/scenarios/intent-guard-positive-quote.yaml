name: intent-guard-positive-quote
description: the other half of the intent guard - a quotation asked for politely is
  still asked for. "ช่วยสร้างใบเสนอราคา D-2026-0001 ให้หน่อยได้ไหมครับ" must produce
  Q-2026-0001, exactly where "ยังไม่สร้างใบเสนอราคา D-2026-0001" must not.
backend: any
actor:
  oa: sales
  role: sales
  language: th
  permissions: sales
steps:
- seed:
    customers:
    - ref: somchai
      first_name: สมชาย
      last_name: ใจดี
      phone: '0812345678'
    deals:
    - ref: deal1
      contact_id: $somchai
- send: ข้อมูลดีล D-2026-0001
  expect:
    contains: D-2026-0001
    is_not: [generic_error, not_sure, permission, not_found]
- send: เพิ่มพัดลม ราคา 1000 อีก 2 ตัว
  expect:
    contains: 2,000.00
    is_not: [generic_error, not_sure, permission, not_found]
- send: ช่วยสร้างใบเสนอราคา D-2026-0001 ให้หน่อยได้ไหมครับ
  expect:
    contains: Q-2026-0001
    not_contains: ['ยังไม่ได้สร้างใบเสนอราคา']
    is_not: [generic_error, not_sure, permission, not_found]
- send: รายการใบเสนอราคา
  expect:
    contains: Q-2026-0001
    is_not: [generic_error, permission]
