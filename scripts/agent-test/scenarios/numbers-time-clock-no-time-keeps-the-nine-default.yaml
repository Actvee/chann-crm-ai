name: numbers-time-clock-no-time-keeps-the-nine-default
description: A date with no time in it at all still books 09:00 — the owner's rule 1 — and
  the reply echoes the hour it chose.
backend: fake
actor:
  oa: customer
  role: sales
  language: th
  permissions: customer
steps:
- seed:
    warranties:
    - serial_number: ONLY00001
      product_name: แอร์ทดสอบ
      customer_chann_uid: CHN-S-000001
      warranty_end: '2099-01-01'
- send: แอร์ไม่เย็น
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains: T-2026-0001
- send: 99/1 ถนนสุขุมวิท
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains: วันไหน
- send: 15 ก.ย. 2569
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains: 09:00
- send: งานของฉัน
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains:
    - T-2026-0001
    - 09:00
