name: numbers-time-quantity-word-three-more
description: 'The Thai number word counts: "เพิ่มพัดลมอีกสามตัว" adds three, so the deal reads
  5,000.00 (review v3, quantity-004).'
backend: any
actor:
  oa: sales
  role: sales
  language: th
  permissions: sales
steps:
- seed:
    customers:
    - ref: somchai
      first_name: สมชาย
      last_name: ใจดี
      phone: 0812345678
    deals:
    - ref: deal1
      contact_id: $somchai
- send: ข้อมูลดีล D-2026-0001
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains: D-2026-0001
- send: เพิ่มพัดลม ราคา 1000 อีก 2 ตัว
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains: 2,000.00
- send: เพิ่มพัดลมอีกสามตัว
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    - เพิ่มพัดลมอีก 1 ตัวแล้ว
    max_lines: 15
- send: ข้อมูลดีล D-2026-0001
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains: 5,000.00
