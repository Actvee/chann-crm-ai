name: review-v3-no-checkin-022
description: no-checkin; intent-safety; synthetic inputs, inspect assertions and state
  read-back. Do not check in for a negation/question/future/reported statement. Read-back
  status must stay assigned.
backend: fake
actor:
  oa: technician
  role: technician
  language: th
  permissions: technician
steps:
- seed:
    raw:
      tickets:
      - id: t1
        ticket_number: T-2026-0001
        status: assigned
        accept_status: accepted
        assigned_to_ref: member-1
        customer_name: สมชาย
        customer_phone: 0812345678
        service_address: 99/1 สุขุมวิท
        issue_description: แอร์ไม่เย็น
        scheduled_date: '2026-09-15'
        scheduled_time: '10:00'
- send: ถ้าถึงแล้วค่อยเช็คอิน T-2026-0001
  expect:
    is_not:
    - generic_error
    - permission
    not_contains:
    - เช็คอิน T-2026-0001 แล้ว
    max_lines: 15
- send: ข้อมูลงาน T-2026-0001
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - กำลังทำ
    max_lines: 15
    contains:
    - T-2026-0001
    - มอบหมายแล้ว
