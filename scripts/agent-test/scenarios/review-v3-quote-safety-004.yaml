name: review-v3-quote-safety-004
description: quote-safety; offline-rule; synthetic inputs, inspect assertions and
  state read-back. Starting quantity 2 at 1000 each; after เพิ่มพัดลมอีก 0 ตัว total
  must be 2,000.00; verify using read-back.
backend: any
actor:
  oa: sales
  role: sales
  language: th
  permissions: sales
steps:
- seed:
    customers:
    - ref: somchai
      first_name: สมชาย
      last_name: ใจดี
      phone: 0812345678
    deals:
    - ref: deal1
      contact_id: $somchai
- send: ข้อมูลดีล D-2026-0001
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains: D-2026-0001
- send: เพิ่มพัดลม ราคา 1000 อีก 2 ตัว
  expect:
    is_not:
    - generic_error
    - not_sure
    - permission
    - not_a_feature
    not_contains:
    - due_time
    - owner_member_id
    - service_address
    - issue_description
    max_lines: 15
    contains: 2,000.00
- send: ถ้าจะสร้างใบเสนอราคา D-2026-0001 ต้องทำอย่างไร
  expect:
    is_not:
    - generic_error
- send: รายการใบเสนอราคา
  expect:
    not_contains:
    - Q-2026-0001
    is_not:
    - generic_error
